<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <main>

            <div class="calculator">

                <div class="display">

                    <div class="expression"></div>

                    <div class="result">0</div>

                </div>

                <div class="function-keys">
                    <button class="history-btn">🕓</button>
                    <button class="backspace-btn">⌫</button>
                    <button class="clear-btn">AC</button>
                </div>

                <div class="keypad">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operator">÷</button>

                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">×</button>

                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operator">-</button>

                    <button>0</button>
                    <button>.</button>
                    <button class="equals">=</button>
                    <button class="operator">+</button>

                </div>

            </div>

        </main>

        <script src="script.js"></script>
    </body>
</html>
